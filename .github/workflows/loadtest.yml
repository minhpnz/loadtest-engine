name: Load test

# Scenario 2: someone presses Run workflow and picks a commit. The image is looked up by the
# commit's source tree (built only if missing), so nobody types a digest.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Registered service
        required: true
        default: payment-service
        type: string
      service_ref:
        description: Full 40-character commit SHA to test (empty = the commit this workflow runs on)
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      service: ${{ inputs.service }}
      ref: ${{ inputs.service_ref || github.sha }}

  loadtest:
    needs: build
    # Dedicated runner pod in EKS: ClusterIP/DNS access is needed for monitoring and guard.
    runs-on: [self-hosted, linux, x64, loadtest-eks]
    timeout-minutes: 65
    concurrency:
      group: loadtest-sandbox
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-loadtest
        with:
          service: ${{ inputs.service }}
          service_ref: ${{ inputs.service_ref || github.sha }}
          service_image: ${{ needs.build.outputs.image }}
          github_token: ${{ github.token }}
          service_repository_token: ${{ secrets.SERVICE_REPOSITORY_TOKEN }}
          preflight_token: ${{ secrets.PREFLIGHT_TOKEN }}
