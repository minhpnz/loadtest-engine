apiVersion: v1
kind: Namespace
metadata:
  name: loadtest-ci
---
apiVersion: batch/v1
kind: Job
metadata:
  name: github-runner
  namespace: loadtest-ci
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        role: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: REPLACE_WITH_RUNNER_IMAGE_DIGEST
          command: [/bin/bash, -euc]
          args:
            - |
              ./config.sh --url "$GITHUB_REPOSITORY_URL" --token "$RUNNER_REGISTRATION_TOKEN" \
                --name "loadtest-${HOSTNAME}" --labels loadtest-eks --work _work \
                --unattended --ephemeral --disableupdate
              unset RUNNER_REGISTRATION_TOKEN
              exec ./run.sh
          env:
            - name: GITHUB_REPOSITORY_URL
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: repository_url
            - name: RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
