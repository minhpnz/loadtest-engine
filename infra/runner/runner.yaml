apiVersion: v1
kind: Namespace
metadata:
  name: loadtest-ci
---
# One long-lived self-hosted runner. The cluster exists only for load testing and is destroyed as a
# whole at decommission, so a persistent runner replaces per-run ephemeral registration. Jobs still
# run one at a time (single replica + workflow concurrency); actions/checkout cleans the workspace
# and each job gets fresh OIDC credentials, so nothing secret carries over between jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: loadtest-ci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        role: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: REPLACE_WITH_RUNNER_IMAGE_DIGEST
          command: [/bin/bash, -euc]
          args:
            - |
              # --replace keeps one registration under a fixed name across pod restarts.
              ./config.sh --url "$GITHUB_REPOSITORY_URL" --token "$RUNNER_REGISTRATION_TOKEN" \
                --name loadtest-eks-runner --labels loadtest-eks --work _work \
                --unattended --replace --disableupdate
              unset RUNNER_REGISTRATION_TOKEN
              exec ./run.sh
          env:
            - name: GITHUB_REPOSITORY_URL
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: repository_url
            - name: RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
