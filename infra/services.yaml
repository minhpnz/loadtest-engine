# Platform-owned catalog: who may test which service, from which repository and image repository.
services:
  payment-service:
    team: payments-team
    owner_ids: ["51442765"]  # numeric GitHub user IDs (gh api user --jq .id)
    repository: https://github.com/minhpnz/loadtest-engine.git
    repository_path: developer/examples/payment-service  # service subdirectory inside the repository
    image_repository: ghcr.io/minhpnz/loadtest-demo/service
    local_path: developer/examples/payment-service
    local_image: loadtest/payment-service:local
    profile: small
    port: 8080
    health_path: /health
    config_path: load-tests/load-test-config.yaml
    allowed_endpoints: [/checkout]
    # Test-only AWS Secrets Manager ARNs, configured by the platform, never by the scenario.
    secrets: []
