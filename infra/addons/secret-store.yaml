apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: payments-team
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          loadtest.engine/team: payments-team
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      # Uses the operator's EKS Pod Identity; never the test pod's identity.
