grafana:
  enabled: false
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    scrapeInterval: 5s
    evaluationInterval: 5s
    retentionSize: 2GB
    nodeSelector:
      role: system
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
alertmanager:
  alertmanagerSpec:
    nodeSelector: {role: system}
    secrets: [guard-auth]
  config:
    route:
      receiver: 'null'
      group_by: [namespace, run_id]
      group_wait: 0s
      routes:
        - receiver: guard
          matchers: ['alertname="LoadTestSafetyAbort"']
    receivers:
      - name: 'null'
      - name: guard
        webhook_configs:
          - url: http://guard.loadtest-system.svc.cluster.local:8080/alerts
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/guard-auth/token
kube-state-metrics:
  nodeSelector: {role: system}
  metricLabelsAllowlist:
    - namespaces=[loadtest.engine/run,loadtest.engine/managed]
